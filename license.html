<!-- license.html - Écran de saisie de licence -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificat - VisionExtract</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .license-container {
            max-width: 500px;
            width: 100%;
        }

        .license-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .license-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .license-logo i {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #1a472a, #2e7d32);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .license-logo h1 {
            font-size: 1.8rem;
            margin-top: 12px;
            color: #1e293b;
        }

        .license-logo p {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .machine-id-box {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }

        .machine-id-box label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            display: block;
            margin-bottom: 8px;
        }

        .machine-id {
            font-family: monospace;
            font-size: 0.9rem;
            color: #1a472a;
            font-weight: 600;
            word-break: break-all;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1rem;
            font-family: monospace;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #1a472a;
            box-shadow: 0 0 0 3px rgba(26, 71, 42, 0.1);
        }

        .btn-activate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a472a, #2e7d32);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-activate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 71, 42, 0.4);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .message.error {
            background: #fee2e2;
            color: #dc2626;
            display: block;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        @media (max-width: 640px) {
            .license-card {
                padding: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="license-container">
        <div class="license-card">
            <div class="license-logo">
                <i class="fas fa-chart-line"></i>
                <h1>VisionExtract</h1>
                <p>Activation de l'application</p>
            </div>

            <div class="machine-id-box">
                <label><i class="fas fa-microchip"></i> ID DE LA MACHINE</label>
                <div class="machine-id" id="machine-id">Chargement...</div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-key"></i> CLE D'ACTIVATION</label>
                <input type="text" id="license-key" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" autocomplete="off">
            </div>

            <button class="btn-activate" onclick="activateLicense()">
                <i class="fas fa-unlock-alt"></i> Activer l'application
            </button>

            <div id="message" class="message"></div>

            <div class="footer">
                <i class="fas fa-copyright"></i>VisionExtract - Tous droits réservés
            </div>
        </div>
    </div>

    <script>
        // Récupérer le Machine ID
        async function getMachineId() {
            try {
                const response = await fetch('/api/license/machine-id');
                const data = await response.json();
                document.getElementById('machine-id').textContent = data.machine_id;
            } catch (error) {
                document.getElementById('machine-id').textContent = 'Erreur de chargement';
            }
        }

        // Activer la licence
        async function activateLicense() {
            const licenseKey = document.getElementById('license-key').value.trim();
            const messageDiv = document.getElementById('message');
            
            if (!licenseKey) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Veuillez entrer un code d identification';
                return;
            }

            messageDiv.className = 'message';
            messageDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/license/activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ license_key: licenseKey })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = result.message;
                    // Rediriger vers l'application après 2 secondes
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = result.message;
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Erreur de connexion au serveur';
            }
        }

        getMachineId();
    </script>
</body>
</html>
